<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10271f">
<title>Field Atlas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --forest:#10271f;--forest2:#193c30;--sage:#adc7ae;--moss:#4f6d57;--lime:#c9df90;--gold:#b8862f;--edge:#7d897f;--mint:#5fd4a0;--sky:#4fb8e8;
  --paper:#f3f3ec;--white:#fffefa;--ink:#17251e;--muted:#59645c;--line:#e2e6dc;--soft:#edf1e9;
  --shadow:0 18px 50px #152c2014;--accent:#3f7d6a;
  --font:'DM Sans',sans-serif;--display:'Manrope',sans-serif;--mono:'DM Mono',monospace;
}
:root[dir=rtl]{--font:'Readex Pro',sans-serif;--display:'Readex Pro',sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--font)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
.hero2 :focus-visible,.fhero :focus-visible,.rcard :focus-visible,.lang-pick :focus-visible{outline-color:var(--lime)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:auto;padding:0 24px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:#f3f3ecf7;border-bottom:1px solid var(--line)}
.top .wrap{height:66px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--forest);font:800 15px var(--display)}
.brand i{width:34px;height:34px;border-radius:10px;background:var(--forest);color:var(--lime);display:grid;place-items:center;font-style:normal;font-size:18px}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{padding:8px 12px;border-radius:9px;text-decoration:none;font-weight:600;font-size:14px;color:#43594d}
.nav a:hover,.nav a.on{background:var(--soft);color:var(--forest)}
.lang{border:1px solid var(--line);background:var(--white);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px}

/* shared */
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--moss)}
:root[dir=rtl] .eyebrow{letter-spacing:0;font-family:var(--font);font-size:12px}
h1,h2,h3{font-family:var(--display);color:var(--forest);margin:0}
.muted{color:var(--muted)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted);padding:22px 0 0}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--forest)}
.crumbs span::before{content:'/';margin-inline-end:6px;opacity:.5}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:13px;padding:4px 11px;border-radius:99px;background:var(--soft);color:#33463b}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-weight:700;text-decoration:none;background:var(--forest);color:#fff}
.btn.ghost{background:var(--white);color:var(--forest);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.12)}
.soon{font-size:11px;padding:2px 8px;border-radius:99px;background:#f3e6cf;color:#7a5a1f;white-space:nowrap}
.view{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}html{scroll-behavior:auto}}

/* home */
.hero{padding:46px 0 26px;display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:end}
.hero h1{font-size:clamp(32px,4.6vw,54px);line-height:1.08;letter-spacing:-.02em;margin:10px 0 12px}
.hero p{margin:0;color:var(--muted);font-size:16px;max-width:600px}
.search{position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--white);border-radius:14px;padding:14px 16px;font-size:15px}
.results{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:4}
.results a{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;text-decoration:none;border-bottom:1px solid var(--soft)}
.results a:hover{background:var(--soft)}
.ladder-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:8px 0 34px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--white)}
.ladder-strip div{padding:16px;border-inline-end:1px solid var(--line);position:relative}
.ladder-strip div:last-child{border:0}
.ladder-strip b{display:block;font-family:var(--display);color:var(--forest)}
.ladder-strip small{color:var(--muted);font-size:12.5px;line-height:1.45;display:block;margin-top:4px}
.ladder-strip .n{font:500 11px var(--mono);color:var(--moss)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:0 0 14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.fcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:20px;transition:transform .2s,box-shadow .2s;border-top:4px solid var(--accent)}
.fcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.fcard .ico{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px}
.fcard h3{font-size:18px}
.fcard q{color:var(--muted);font-size:14px}
.fcard .meta{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}

/* faculty */
.fhero{margin:16px 0 22px;border-radius:24px;padding:34px;background:var(--forest);color:#e9efe6;position:relative;overflow:hidden}
.fhero::after{content:attr(data-icon);position:absolute;inset-inline-end:28px;top:10px;font-size:150px;opacity:.12;color:var(--lime)}
.fhero h1{color:#fff;font-size:clamp(28px,4vw,44px)}
.fhero .q{font-size:clamp(18px,2.2vw,24px);color:var(--lime);font-family:var(--display);margin:10px 0 0;font-weight:700}
.fhero .bar{position:absolute;inset-block:0;inset-inline-start:0;width:8px;background:var(--accent)}
.fcols{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;margin-bottom:28px}
.fcols h3{font-size:15px;margin-bottom:8px}
.fcols p{margin:0 0 10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;transition:border-color .2s,transform .2s}
.mcard:hover{border-color:var(--accent);transform:translateY(-2px)}
.mcard b{font-family:var(--display);color:var(--forest);font-size:16px}
.mcard small{color:var(--muted);font-size:13.5px}
.mcard .go{margin-top:auto;font-size:12.5px;color:var(--accent);font-weight:700}

/* major */
.mhead{padding:14px 0 24px;display:flex;justify-content:space-between;gap:20px;align-items:end;flex-wrap:wrap}
.mhead h1{font-size:clamp(28px,4vw,46px);margin:6px 0 8px}
.mhead .one{font-size:17px;color:var(--muted);max-width:720px;margin:0}
.think{border-inline-start:4px solid var(--accent);background:var(--white);border-radius:14px;padding:16px 20px;font-size:17px;font-family:var(--display);color:var(--forest);margin-bottom:22px}
.mlayout{display:grid;grid-template-columns:330px 1fr;gap:20px;align-items:start}
.side{display:grid;gap:14px;position:sticky;top:84px}
.side h3{font-size:14px;margin-bottom:10px}
.side ul{margin:0;padding-inline-start:18px}
.steps{position:relative;display:grid;gap:14px}
.steps::before{content:'';position:absolute;inset-block:26px;inset-inline-start:23px;width:2px;background:linear-gradient(var(--accent),var(--line))}
.step{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start}
.dot{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 16px var(--display);position:relative;z-index:1;box-shadow:0 0 0 6px var(--paper)}
.step .card{padding:18px 20px}
.step h3{font-size:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.step h3 small{font:500 12px var(--mono);color:var(--muted)}
.step p{margin:6px 0 10px;color:var(--muted)}
.cta{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.outline-note{margin:10px 0 0;padding:16px;border-radius:14px;background:#f8f1e3;border:1px solid #ecdcbc}

/* ladder page */
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:18px 0}
.lgrid ol{margin:8px 0 0;padding-inline-start:20px}
.abbr{margin:6px 0 18px}
.abbr-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:10px 18px;margin:0}
.abbr-list>div{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line,#e6e2d8)}
.abbr-list dt{flex:0 0 92px;font-weight:800;color:var(--forest,#2f5d50);font-size:15px}
.abbr-list dd{margin:0;display:flex;flex-direction:column;gap:2px}
.abbr-list dd span{color:var(--muted,#5d6b66);font-size:15px;line-height:1.5}
.warn{background:#f8f1e3;border:1px solid #ecdcbc;border-radius:14px;padding:16px 18px;margin:14px 0}

/* roadmap builder */
.rm{display:grid;grid-template-columns:1fr 400px;gap:22px;align-items:start;padding-bottom:40px}
.rstep{margin-bottom:14px}
.rstep h3{font-size:16px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.rstep h3 .num{width:28px;height:28px;border-radius:50%;background:var(--forest);color:var(--lime);display:grid;place-items:center;font-size:13px;flex:none}
.rstep.locked{opacity:.45;pointer-events:none}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choice{border:1px solid var(--line);background:var(--white);border-radius:11px;padding:9px 13px;font-size:14px;text-align:start;display:flex;align-items:center;gap:8px}
.choice:hover{border-color:var(--moss)}
.choice.on{background:var(--forest);border-color:var(--forest);color:#fff}
.choice .sw{width:10px;height:10px;border-radius:3px;flex:none}
.choice.alt{border-style:dashed}
.rstep input[type=text]{width:100%;border:1px solid var(--line);background:var(--white);border-radius:11px;padding:11px 14px}
.rcard{position:sticky;top:84px;background:var(--forest);color:#e9efe6;border-radius:22px;padding:24px;overflow:hidden}
.rcard .top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rcard .logo{font:800 12px var(--display);color:var(--lime);letter-spacing:.08em}
.rcard h2{color:#fff;font-size:24px;margin:14px 0 2px}
.rcard .sub{color:var(--sage);font-size:13px}
.rline{margin:18px 0 0;display:grid;gap:0}
.rnode{display:grid;grid-template-columns:30px 1fr;gap:10px;position:relative;padding-bottom:14px}
.rnode::before{content:'';position:absolute;inset-inline-start:14px;top:26px;bottom:0;width:2px;background:#ffffff26}
.rnode:last-child::before{display:none}
.rnode i{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font:700 12px var(--display);font-style:normal;color:#fff}
.rnode.empty i{background:#ffffff1f;color:#ffffff80}
.rnode small{display:block;color:var(--sage);font-size:11.5px;font-family:var(--mono)}
.rnode b{color:#fff;font-weight:600}
.rnode.empty b{color:#ffffff70;font-weight:400}
.rthink{margin-top:8px;padding:12px 14px;border-radius:12px;background:#ffffff12;font-size:13.5px}
.rthink b{color:var(--lime);display:block;font-size:12px;margin-bottom:2px}
:root[dir=rtl] .rnode small,:root[dir=rtl] .step h3 small,:root[dir=rtl] .ladder-strip .n{font-family:var(--font)}
.ractions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

footer{border-top:1px solid var(--line);margin-top:30px;padding:22px 0 34px;color:var(--muted);font-size:13px}

/* responsive */
@media (max-width:980px){
  .hero,.fcols,.mlayout,.rm{grid-template-columns:1fr}
  .side,.rcard{position:static}
  .ladder-strip{grid-template-columns:1fr 1fr}
  .ladder-strip div{border-inline-end:0;border-bottom:1px solid var(--line)}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .top .wrap{height:auto;padding-block:10px;flex-wrap:wrap;gap:8px}
  .nav{order:3;width:100%;margin:0;overflow-x:auto}
  .lang{margin-inline-start:auto}
  .ladder-strip{grid-template-columns:1fr}
  .fhero{padding:24px}
  .fhero::after{font-size:90px}
}

/* compare */
.cmp-pick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.cmp-pick select{font:inherit;border:1px solid var(--line);background:var(--white);border-radius:11px;padding:10px 12px;max-width:100%}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch}
.cmp-col{border-top:5px solid var(--accent)}
.cmp-col h3{font-size:14px;margin:14px 0 8px}
.cmp-head{display:flex;gap:12px;align-items:center}
.cmp-head .ico{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;flex:none}
.cmp-head h2{font-size:22px}
.cmp-q{font:700 19px var(--display);color:var(--accent);margin:12px 0 6px}
.cmp-vs{align-self:center;font:800 14px var(--display);color:var(--moss);background:var(--soft);border-radius:99px;padding:8px 12px}
a.pill{text-decoration:none}a.pill:hover{background:var(--sage)}

/* lesson / present mode */
body.presenting footer{display:none}
.slide{min-height:calc(100vh - 160px);padding:26px 0 120px}
.slide h1{font-size:clamp(32px,4.4vw,58px);line-height:1.1;margin:8px 0 12px;letter-spacing:-.01em}
.slide-sub{font-size:clamp(17px,1.6vw,21px);color:var(--muted);max-width:900px;margin:0 0 24px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.qcard{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--white);border:1px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:14px;padding:16px;font:700 17px/1.35 var(--display);color:var(--forest);transition:transform .2s}
.qcard:hover{transform:translateY(-2px)}
.qcard .ico{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none;font-size:18px}
.ladder-strip.big b{font-size:20px}.ladder-strip.big small{font-size:14px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.mini{border-top:5px solid var(--accent)}
.mini h3{font-size:22px;margin:6px 0 10px}
.mini ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.mini li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;column-gap:10px}
.mini li::before{content:counter(s);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 13px var(--display)}
.mini li:last-child::before{content:'★'}
.mini small{color:var(--muted);font-size:12.5px}
.mini b{font-size:16px;color:var(--forest)}
.l5{display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center}
.l5-steps{font:600 clamp(18px,1.8vw,24px)/1.5 var(--display);color:var(--forest);padding-inline-start:28px;margin:0}
.l5-steps li{margin-bottom:16px}
.qr{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center;max-width:380px;box-shadow:var(--shadow)}
.qr-img svg{width:260px;height:260px;display:block;margin:auto}
.qr-url{display:block;margin-top:10px;font:500 14px var(--mono);word-break:break-all;color:var(--forest)}
.slide-nav{position:fixed;bottom:0;inset-inline:0;z-index:6;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px 16px;background:#f3f3ecf2;backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.slide-nav .btn{padding:9px 14px}
.slide-nav .off{opacity:.35;pointer-events:none}
.dots{display:flex;gap:6px;margin:0 6px}
.dots a{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots a.on{background:var(--forest);width:26px;border-radius:99px}
.keys{font-size:12px;color:var(--muted);width:100%;text-align:center}
@media (max-width:980px){.cmp{grid-template-columns:1fr}.cmp-vs{justify-self:center}.l5{grid-template-columns:1fr}.qr{margin:auto}}
@media (max-width:640px){.keys,#fsBtn{display:none}.qr-img svg{width:200px;height:200px}}
/* keep slide buttons clear of the hosting badge in the bottom-right corner */
.slide-nav{padding-right:220px;padding-left:16px}
@media (max-width:760px){.slide-nav{padding-right:16px;padding-bottom:64px}.slide{padding-bottom:190px}}

/* header: brand + buttons on the first row, the numbered lesson steps on their own row (they wrap, never hide) */
.brand,.nav a{white-space:nowrap}
.brand,.lang{flex-shrink:0}
.top .wrap{height:auto;padding-block:10px;flex-wrap:wrap;gap:8px}
.nav{order:3;width:100%;margin:0;flex-wrap:wrap;min-width:0}
.top .lang:first-of-type{margin-inline-start:auto}
.side,.rcard{top:120px}
html{scroll-padding-top:120px}

/* country layer */
.cc{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 5px;border-radius:5px;background:var(--forest);color:var(--lime);font:700 10.5px var(--mono);letter-spacing:.03em;vertical-align:middle;direction:ltr}
.choice .cc{margin-inline-end:2px}
.choice.on .cc{background:var(--lime);color:var(--forest)}
.ctry-card,.ctry-path{border-inline-start:4px solid var(--forest)}
.ctry-card h3,.ctry-path h3{display:flex;gap:8px;align-items:center}
.ctry-card p,.ctry-path p{margin:0 0 8px}
.ctry-path{background:#f6f8f1}
.ctry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0 10px}
.ctry-grid h3,.ctry-mini h3{display:flex;gap:8px;align-items:center;font-size:16px}
.ctry-grid ol,.ctry-mini ol{margin:8px 0 10px;padding-inline-start:20px}
.ctry-grid p{font-size:13.5px;margin:0 0 6px}
.ctry-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ctry-mini .card{padding:14px 16px}
.ctry-mini ol{font-size:14px;margin-bottom:0}

/* roadmap v2 */
.where{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.where>span{font-weight:700;font-size:13px;color:var(--moss);margin-inline-end:4px}
.where .choice{padding:6px 10px;font-size:13px}
.rnode .cc{margin-inline-start:6px;background:#ffffff26;color:var(--lime)}
.rthink.planb{border:1px dashed #ffffff40;background:transparent}
.rtodo{margin:4px 0 0;padding-inline-start:18px;display:grid;gap:3px}
.rqr{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12.5px;color:var(--sage)}
.rqr svg{width:84px;height:84px;background:#fff;border-radius:8px;padding:4px;flex:none}

/* personality test */
.test-intro{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:center;padding:16px 0 10px}
.test-intro h1{font-size:clamp(28px,4vw,44px);margin:6px 0 10px}
.test-intro .checks{margin:14px 0}
.test-hex{text-align:center}.test-hex p{font-size:13px;max-width:320px;margin:6px auto 0}
.hex{width:100%;max-width:320px;height:auto}
.hex-ring{fill:none;stroke:var(--line);stroke-width:1.2}
.hex-me{fill:#3f7d6a40;stroke:var(--forest);stroke-width:2.5;stroke-linejoin:round}
.hex-l{fill:#fff;font:800 13px 'DM Sans',sans-serif;text-anchor:middle}
.test-top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding:18px 0 14px;position:sticky;top:66px;background:var(--paper);z-index:3}
.test-top h2{font-size:clamp(20px,2.4vw,28px);margin-top:4px}
.prog{flex:1;min-width:200px;max-width:360px;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog span{display:block;height:100%;background:var(--moss);transition:width .3s}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:q}
.qrow{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.qrow legend{margin:0 0 10px;font-weight:600;font-size:16px;color:var(--forest)}
.qrow.miss{border-color:#c0703c;box-shadow:0 0 0 3px #c0703c22}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc{border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:8px 4px;display:grid;gap:2px;justify-items:center;font-size:12px;color:var(--muted);line-height:1.25;text-align:center}
.sc b{font-size:15px;color:var(--forest)}
.sc:hover{border-color:var(--moss)}
.sc.on{background:var(--forest);border-color:var(--forest);color:#e9efe6}.sc.on b{color:var(--lime)}
.res-head{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;align-items:center;padding:16px 0 0}
.code{display:flex;gap:10px;margin:10px 0}
.code span{width:64px;height:64px;border-radius:16px;color:#fff;display:grid;place-items:center;font:800 32px var(--display)}
.res-names{font-weight:600;color:var(--forest);margin:0 0 14px}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13.5px}
.bt{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.bt i{display:block;height:100%;border-radius:99px}
.bar b{text-align:end;color:var(--forest)}
.types3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.type-card{border-top:5px solid var(--accent)}
.type-card h3{display:flex;gap:8px;align-items:center;font-size:17px;flex-wrap:wrap}
.type-card .tl{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.type-card details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.type-card summary{cursor:pointer;font-weight:700;color:var(--accent)}
.type-card ul{margin:8px 0 0;padding-inline-start:18px;display:grid;gap:4px}
.res-acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:auto}
.rcode{color:var(--lime);letter-spacing:.06em}
@media (max-width:980px){.test-intro,.res-head{grid-template-columns:1fr}.test-top{top:110px}}
@media (max-width:640px){.sc span{font-size:10px}.sc{padding:10px 4px}.bar{grid-template-columns:110px 1fr 40px}}

/* costs & scholarships */
.cost-card h3{flex-wrap:wrap}
.dollars{margin-inline-start:auto;font:700 14px var(--mono);color:var(--forest);letter-spacing:.05em;direction:ltr}
.dollars i{font-style:normal;color:var(--line)}
.cost-card p{font-size:14px;margin:0 0 8px}
.schol{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.schol-row{display:grid;gap:6px;text-decoration:none;box-shadow:none;padding:16px}
.schol-row:hover{border-color:var(--moss)}
.schol-row b{color:var(--forest);font-family:var(--display)}
.schol-row .pill{justify-self:start;font-size:12px}
.schol-row small{color:var(--muted);font-size:13.5px;line-height:1.5}
.money-cta{display:grid;gap:4px;text-decoration:none;margin:14px 0;border-inline-start:4px solid var(--gold);box-shadow:none}
.money-cta b{color:var(--forest);font-family:var(--display);font-size:17px}
.checked{font-size:12.5px;margin:10px 0 0}
.foot-links{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:8px}
.foot-links a{color:var(--forest);font-weight:600;text-decoration:none}
.foot-links a:hover{text-decoration:underline}
footer p{margin:0}

/* worksheet */
.ws-actions{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0}
.ws-actions p{margin:0;max-width:600px}
.ws{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;max-width:860px;margin:0 auto 30px;color:#17251e}
.ws-head{border-bottom:2px solid var(--forest);padding-bottom:12px;margin-bottom:16px}
.ws-head .logo{font:800 12px var(--display);color:var(--moss);letter-spacing:.08em}
.ws-head h1{font-size:28px;margin:4px 0 12px}
.ws-name{display:grid;grid-template-columns:auto 1fr auto 120px;gap:10px;align-items:end;font-weight:600}
.ws-line{display:block;border-bottom:1.5px solid #9aa79e;height:30px}
.ws-line.short{height:22px}
.ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ws-box{margin-bottom:14px;break-inside:avoid}
.ws-box h3{font-size:15px;margin:0 0 2px}
.ws-box p{font-size:12px;margin:0 0 2px}
.ws-table{width:100%;border-collapse:collapse;margin-top:6px}
.ws-table th,.ws-table td{border:1.5px solid #9aa79e;padding:8px;text-align:start;font-size:13px}
.ws-table td{height:34px}.ws-table td:first-child{width:22%;font-weight:600;background:#f4f6f1}
.ws-foot{font-size:11px;color:var(--muted);text-align:center;margin:12px 0 0}
@media (max-width:640px){.ws{padding:18px}.ws-grid{grid-template-columns:1fr}.ws-name{grid-template-columns:auto 1fr}}
@media print{body.ws-page main{max-width:none;padding:0}.ws{border:0;padding:0;margin:0;max-width:none}.ws-line{height:26px}}

/* prepare now */
.track-sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600;color:var(--forest)}
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.year{position:relative;border-top:4px solid var(--moss)}
.ynum{position:absolute;inset-inline-end:18px;top:14px;font:800 34px var(--display);color:var(--soft)}
.year h3{font-size:18px;margin-bottom:6px}
.ygoal{margin:0 0 10px;color:#33463b}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{position:relative;padding-inline-start:26px;line-height:1.5}
.checks li::before{content:'✓';position:absolute;inset-inline-start:0;top:1px;width:18px;height:18px;border-radius:5px;background:var(--soft);color:var(--moss);font-size:12px;display:grid;place-items:center;font-weight:700}
.checks.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));column-gap:22px}
.prep-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.prep-2 h3,.card>h3{font-size:16px;margin-bottom:10px}
.req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.req-row{display:flex;gap:12px;text-decoration:none;padding:16px;border-inline-start:4px solid var(--accent);box-shadow:none}
.req-row:hover{border-color:var(--accent)}
.req-row .ico{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.req-row b{display:block;color:var(--forest);font-family:var(--display)}
.req-row small{display:block;font-size:13px;line-height:1.5;margin-top:3px}
.links{margin:0;padding-inline-start:18px;display:grid;gap:6px}
.links a{color:var(--forest);font-weight:600}
.fac-req{display:grid;gap:10px;margin:0 0 28px}
.req-card{border-inline-start:4px solid var(--accent)}
.req-card p{margin:0 0 8px}
.go-link{display:inline-block;margin-top:8px;font-weight:700;color:var(--accent);text-decoration:none}
@media (max-width:760px){.prep-2{grid-template-columns:1fr}}

/* first-visit language picker */
.lang-pick{position:fixed;inset:0;z-index:20;background:#10271fcc;display:grid;place-items:center;padding:16px;animation:fade .25s ease}
.lang-card{background:var(--white);border-radius:24px;padding:30px 26px;max-width:420px;width:100%;text-align:center;box-shadow:var(--shadow)}
.lp-icon{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:13px;background:var(--forest);color:var(--lime);font-size:22px}
.lang-card h2{font-size:22px;line-height:1.4;margin:14px 0 18px}
.lang-card h2 span{font-family:'Readex Pro',sans-serif}
.lp-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lp-btns button{border:0;border-radius:14px;padding:16px;font:700 18px 'DM Sans',sans-serif;background:var(--forest);color:#fff}
.lp-btns button[lang=ar]{font-family:'Readex Pro',sans-serif;background:var(--accent)}
.lp-btns button:hover{filter:brightness(1.15)}
.lang-card p{color:var(--muted);font-size:13px;margin:16px 0 0;line-height:1.6}

/* print: only the roadmap card */
@media print{
  @page{margin:12mm}
  body{background:#fff}
  .top,footer,.no-print,.rm>.builder{display:none!important}
  .rm{display:block}
  .rcard{position:static;max-width:620px;margin:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .ractions{display:none}
}
